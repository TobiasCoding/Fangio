name: Release

# Pushing a tag vX.Y.Z (created by `npm run release`) builds, verifies and publishes the
# GitHub Release with the installable zip and its SHA-256.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache on purpose: release artifacts are built from a fresh `npm ci`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package.json version (v${version})."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and package
        run: |
          # Reproducible zip timestamps: the tagged commit's date.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm run package
          test -f "release/fangio-v${VERSION}.zip"
          test -f release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="release/fangio-v${VERSION}.zip"
          sha="$(cut -d' ' -f1 release/SHA256SUMS.txt)"
          args=(--repo "$GITHUB_REPOSITORY" --title "Fangio ${GITHUB_REF_NAME}" --verify-tag --latest)
          if node scripts/changelog-notes.mjs "$VERSION" > release-notes.md; then
            echo >> release-notes.md
          else
            echo "No notes for ${VERSION} in CHANGELOG.md; generating them automatically."
            : > release-notes.md
            args+=(--generate-notes)
          fi
          cat >> release-notes.md <<NOTES
          ---

          **Install:** download \`fangio-v${VERSION}.zip\`, extract it into a permanent folder and load it in \`chrome://extensions\` with **Load unpacked** ([guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md)).

          **Update:** run \`update.cmd\` (Windows) or \`update.sh\` inside the installed folder and click **Reload** on Fangio. Your data is kept.

          SHA-256 of \`fangio-v${VERSION}.zip\`: \`${sha}\`
          NOTES
          args+=(--notes-file release-notes.md)
          gh release create "$GITHUB_REF_NAME" "$zip" release/SHA256SUMS.txt "${args[@]}"
